[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "music-scout"
version = "0.1.0"
description = "Auto-fetches current-year tracks from music blogs and Spotify playlists, sorts them into your genre buckets, and adds them to Spotify on a schedule."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Jaime Ortega" }]
dependencies = [
    "spotipy>=2.24.0",       # Spotify Web API + OAuth
    "feedparser>=6.0.11",    # RSS / Atom parsing
    "httpx>=0.27.0",         # HTTP client (RSS fallback fetches, blog HTML)
    "beautifulsoup4>=4.12",  # Parse blog posts for Spotify embeds
    "click>=8.1",            # CLI framework
    "rich>=13.7",            # Pretty terminal output, wizard prompts
    "PyYAML>=6.0",           # Config files
    "platformdirs>=4.0",     # OS-correct cache locations
]

[project.optional-dependencies]
# `pip install music-scout[ai]` enables LLM-derived parse recipes via the
# Anthropic API. Without it (and without the `claude` CLI), feeds fall back to
# the generic parser. Never needed on the daily run.
ai = ["anthropic>=0.40"]

[project.scripts]
scout = "music_scout.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["music_scout"]
