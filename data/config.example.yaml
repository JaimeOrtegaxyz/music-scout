# Copy to config.yaml or let `scout init` generate one.
# This file is gitignored once renamed because `spotify:` holds auth tokens.
spotify:
  client_id: ""        # from developer.spotify.com → your app
  client_secret: ""
  refresh_token: ""    # written automatically after first OAuth handshake
  user_id: ""          # ditto

# The single playlist everything lands in. Created by the wizard on first run;
# playlist_id is filled in then. Newest tracks are inserted at the top.
playlist_id: ""
playlist_name: Music Scout

# Default search market for Spotify queries.
market: US

# Leave unset to use the current calendar year. Set explicitly to backfill a
# specific year, e.g. for a one-time "everything from 2025" pull.
# current_year: 2026
